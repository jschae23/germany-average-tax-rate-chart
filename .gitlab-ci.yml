# GitLab CI configuration for deploying static site to GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache rsync
  script:
    - mkdir -p public
    - rsync -av --progress --exclude=.git --exclude=public . public/
  artifacts:
    paths:
      - public
  only:
    - master